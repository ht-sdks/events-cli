name: Android harness

on:
  push:

jobs:
  android-harness:
    name: test generated wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-33'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate wrappers and test against events-sdk-android
        run: pnpm test:harness android
        env:
          RUN_HARNESS: '1'
