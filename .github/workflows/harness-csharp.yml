name: CSharp harness

on:
  push:

jobs:
  csharp-harness:
    name: test generated wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate wrappers and test against Hightouch.Events.CSharp
        run: pnpm test:harness csharp
        env:
          RUN_HARNESS: '1'
