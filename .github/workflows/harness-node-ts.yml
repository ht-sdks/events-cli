name: Node-ts harness

on:
  push:

jobs:
  node-ts-harness:
    name: test generated wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '22'

      - name: Generate wrappers and test against events-sdk-js-node
        run: pnpm test:harness node-ts
        env:
          RUN_HARNESS: '1'
