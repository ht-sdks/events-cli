name: PHP harness

on:
  push:

jobs:
  php-harness:
    name: test generated wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, json
          tools: composer

      - name: Generate wrappers and test against events-sdk-php
        run: pnpm test:harness php
        env:
          RUN_HARNESS: '1'
