name: PHP harness

on:
  push:

jobs:
  php-harness:
    name: test generated wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
          tools: composer

      - name: Generate wrappers and test against events-sdk-php
        run: pnpm test:harness php
        env:
          RUN_HARNESS: '1'
