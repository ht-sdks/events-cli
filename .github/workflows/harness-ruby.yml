name: Ruby harness

on:
  push:

jobs:
  ruby-harness:
    name: test generated wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '22'

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: test/harness/ruby

      - name: Generate wrappers and test against events-sdk-ruby
        run: pnpm test:harness ruby
        env:
          RUN_HARNESS: '1'
