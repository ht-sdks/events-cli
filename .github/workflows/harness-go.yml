name: Go harness

on:
  push:

jobs:
  go-harness:
    name: test generated wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-cli
        with:
          node-version: '22'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache-dependency-path: test/harness/go/go.sum

      - name: Generate wrappers and test against events-sdk-go
        run: pnpm test:harness go
        env:
          RUN_HARNESS: '1'
